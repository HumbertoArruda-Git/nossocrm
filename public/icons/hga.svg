<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HGA Systems">
  <!--
    O ícone é o horizonte do site, não o logotipo escrito.
    Em 16px três letras viram borrão; o arco luminoso sobre a tinta continua
    reconhecível em qualquer tamanho e é a assinatura visual da própria página.
  -->
  <defs>
    <radialGradient id="hga-glow" cx="50%" cy="100%" r="72%">
      <stop offset="0%" stop-color="#A8C8FF" stop-opacity=".85" />
      <stop offset="42%" stop-color="#2F6BFF" stop-opacity=".42" />
      <stop offset="100%" stop-color="#2F6BFF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#04060C" />
  <ellipse cx="32" cy="72" rx="36" ry="30" fill="url(#hga-glow)" />
  <path d="M5 53 Q32 39 59 53" fill="none" stroke="#A8C8FF" stroke-width="2.4" stroke-linecap="round" />
</svg>
